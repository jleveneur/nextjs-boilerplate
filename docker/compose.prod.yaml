# Local production-like stack: Traefik + the built web image + shared deps.
# CI publishes multi-arch images to GHCR as ghcr.io/<owner>/{web,migrate}:<sha>.
# This file proves migrate-then-roll and the reverse-proxy shape on a laptop with
# locally built tags. Host TLS, DNS, and provider IaC are out of scope — see
# docs/runbooks/deploy.md for the portable deploy sequence.
#
# Reach it at http://web.localhost:8080, not http://localhost:8080. `APP_ENV:
# staging` turns on @repo/env's strict checks (packages/env/src/production.ts),
# which reject a URL whose host *is* `localhost` and any secret prefixed `dev-`.
# A `*.localhost` subdomain still resolves to loopback and passes — the same
# convention Portless uses for `make dev` — so the stack exercises the live-env
# validator instead of opting out of it. Traefik still answers on `localhost`
# and `127.0.0.1` so health probes and k6 keep working, but auth redirects
# follow BETTER_AUTH_URL and only resolve on web.localhost.

name: repo-prod

services:
  traefik:
    image: traefik:v3.7@sha256:5203c3f39ca70de6790d964624e042463ffbd57715bc82be155cf224c0dd5144
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "8080:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:18@sha256:1957b2ff3137e4ef7f3bc813e74fff50b1e1ffddc85c8b9d6f14ade972be8687
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - prod_postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - prod_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  minio-init:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 0.5; done;
      mc mb --ignore-existing local/app;
      exit 0;
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: apply pending Drizzle migrations before any app starts.
  # Dedicated one-shot image so a schema change is not coupled to an app roll.
  # Adopters: `docker compose run --rm migrate` or
  # `docker run --rm … ghcr.io/<owner>/migrate:<sha>`.
  migrate:
    image: repo-migrate:local
    build:
      context: ..
      dockerfile: docker/migrate.Dockerfile
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      APP_ENV: staging
      APP_URL: http://web.localhost:8080
      LOG_LEVEL: info
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      DATABASE_POOL_SIZE: "1"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: repo-web:local
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: http://web.localhost:8080
        NEXT_PUBLIC_APP_ENV: staging
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: staging
      APP_URL: http://web.localhost:8080
      NEXT_PUBLIC_APP_URL: http://web.localhost:8080
      NEXT_PUBLIC_APP_ENV: staging
      LOG_LEVEL: info
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      DATABASE_POOL_SIZE: "10"
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: local-prod-stack-better-auth-secret-min-32-chars
      BETTER_AUTH_URL: http://web.localhost:8080
      EMAIL_FROM: noreply@example.com
      RESEND_API_KEY: re_test_replace_me
      SMTP_URL: smtp://mailpit:1025
      S3_ENDPOINT: http://minio:9000
      S3_REGION: auto
      S3_BUCKET: app
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      # host.docker.internal: k6/ZAP containers reaching Traefik on the host.
      - traefik.http.routers.web.rule=Host(`web.localhost`) || Host(`localhost`) || Host(`127.0.0.1`) || Host(`host.docker.internal`)

      - traefik.http.routers.web.entrypoints=web
      - traefik.http.services.web.loadbalancer.server.port=3000

volumes:
  prod_postgres_data:
  prod_minio_data:
