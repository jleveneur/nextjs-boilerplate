# Local alert rules — each annotation links to a runbook in docs/runbooks/.
groups:
  - name: repo-services
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_server_duration_count{http_status_code=~"5.."}[5m]))
            /
            sum(rate(http_server_duration_count[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: HTTP 5xx rate above 5% for five minutes
          runbook_url: https://github.com/jleveneur/nextjs-boilerplate/blob/main/docs/runbooks/high-error-rate.md
