# Playwright against the built web image + ephemeral test deps.
# Usage: `make e2e` (builds repo-web:local, migrates, runs Playwright on the host).

name: repo-e2e

include:
  - path: compose.test.yaml

services:
  web:
    image: repo-web:local
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        NEXT_PUBLIC_APP_ENV: test
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      APP_ENV: test
      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_ENV: test
      LOG_LEVEL: error
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app_test
      DATABASE_POOL_SIZE: "5"
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: dev-local-better-auth-secret-min-32-chars
      BETTER_AUTH_URL: http://127.0.0.1:3000
      EMAIL_FROM: noreply@example.com
      RESEND_API_KEY: re_test_replace_me
      SMTP_URL: smtp://mailpit:1025
      MAILPIT_API_URL: http://mailpit:8025
      S3_ENDPOINT: http://minio:9000
      S3_REGION: auto
      S3_BUCKET: app-test
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
