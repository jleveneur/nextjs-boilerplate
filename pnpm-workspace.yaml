packages:
  - apps/*
  - packages/*
  - tooling/*

# Install scripts execute arbitrary code, so pnpm blocks them by default and
# every decision has to be explicit and reviewable. Each entry is a deliberate
# answer, `false` included — an unanswered package makes `pnpm install` warn,
# which is the behaviour we want.
#
# Prefer `false`. Only grant `true` when a package genuinely cannot work without
# running code at install time (native compilation, browser downloads).
allowBuilds:
  # lefthook ships prebuilt platform binaries as optional dependencies, so its
  # postinstall — which links a binary into node_modules/.bin — is redundant.
  # Verified: `lefthook version` resolves correctly with the script declined.
  lefthook: false
  # drizzle-kit depends on esbuild to bundle its CLI. Without the install
  # script, the binary is missing and `drizzle-kit generate|migrate` fails.
  esbuild: true
  # Optional native accelerator for msgpackr (BullMQ). Pure-JS fallback works;
  # we do not need the compile step in this repo.
  msgpackr-extract: false
  # React Email pulls Sharp for image tooling. Image derivation is deferred to
  # the worker phase; decline the install script until `@repo/storage` needs it.
  sharp: false
  # protobufjs ships prebuilt code; its postinstall is optional. OTLP HTTP
  # exporters work without the install script regenerating stubs.
  protobufjs: false

# ---------------------------------------------------------------------------
# Dependency catalog
#
# Shared versions are declared once here and referenced as "catalog:" from
# package manifests. This is what prevents two packages from silently
# resolving different copies of React or Zod — the classic monorepo failure.
# Renovate updates this file, so a bump is one reviewed diff.
#
# Versions verified against the npm registry on 2026-07-30.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Peer dependency exceptions
#
# Narrowly scoped and dated. `strict-peer-dependencies=true` in .npmrc means an
# unmet peer is an error, which is what we want — so every exception is written
# down with the reason it is safe and the condition for deleting it.
# ---------------------------------------------------------------------------
peerDependencyRules:
  allowedVersions:
    # knip → oxc-parser / oxc-resolver ship wasm32-wasi bindings whose
    # @napi-rs/wasm-runtime wants an @emnapi 2.x alpha. That binding is the
    # fallback for platforms with no native binary, so it is never loaded on any
    # platform we build for. Remove once oxc's wasm bindings track a stable
    # @emnapi 2.
    "@napi-rs/wasm-runtime>@emnapi/core": "1"
    "@napi-rs/wasm-runtime>@emnapi/runtime": "1"

# An entry is added when the first package consumes it, never in anticipation:
# Knip reports unused catalog entries, and a catalog full of aspirations trains
# people to ignore that report.
catalog:
  # --- Language & runtime types -------------------------------------------
  typescript: 7.0.2
  "@types/node": 24.13.3

  # --- Validation ----------------------------------------------------------
  # Sole runtime dependency of @repo/env. Also used by contracts, forms, and
  # every external-input boundary. Catalogued once so the whole monorepo shares
  # one Zod major.
  zod: 4.4.3

  # --- Data ----------------------------------------------------------------
  # Pinned to ADR-0008 (drizzle-orm 0.45.x + drizzle-kit 0.31.x) until v1 GA.
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  # postgres.js — portable TCP driver; no vendor serverless driver in app code.
  postgres: 3.4.9
  # Script runner for migrate/seed entrypoints (Node strips types, but tsx
  # resolves TypeScript path/extension quirks in workspace packages).
  tsx: 4.23.1

  # --- Testing -------------------------------------------------------------
  # Pinned exactly, not caret-ranged: Vitest's type-testing mode is explicitly
  # experimental and documented as not following SemVer, and it is what verifies
  # the branded types in @repo/types.
  vitest: 4.1.10
  # Declared by every package that sets a coverage threshold: Vitest resolves the
  # provider from the project, not from its own installation.
  "@vitest/coverage-v8": 4.1.10

  # --- Platform adapters -------------------------------------------------
  # Entries are added when the first package consumes them (Knip flags unused
  # catalog pins). See docs/architecture/13-dependency-review.md for rationale.
  pino: 10.3.1
  ioredis: 5.11.1
  bullmq: 5.81.3
  "@aws-sdk/client-s3": 3.1099.0
  "@aws-sdk/s3-request-presigner": 3.1099.0
  resend: 6.18.1
  "@react-email/components": 1.0.12
  "@react-email/render": 2.1.0
  react-email: 6.9.1
  nodemailer: 9.0.3
  "@types/nodemailer": 8.0.1
  react: 19.2.8
  "react-dom": 19.2.8
  "@types/react": 19.2.18
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/sdk-node": 0.221.0
  "@opentelemetry/exporter-trace-otlp-http": 0.221.0
  "@opentelemetry/resources": 2.10.0
  "@opentelemetry/semantic-conventions": 1.43.0
  "@sentry/node": 10.69.0
  better-auth: 1.6.25
  "@better-auth/api-key": 1.6.25
  "@better-auth/passkey": 1.6.25

minimumReleaseAgeExclude:
  - "@aws-sdk/client-s3@3.1099.0"
  - "@aws-sdk/s3-request-presigner@3.1099.0"
  - "@types/react@19.2.18"
  - bullmq@5.81.3
