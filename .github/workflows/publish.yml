name: Publish images

# Post-merge release artifacts for every push to main (and workflow_dispatch):
#   - multi-arch app images → GHCR as :sha
#   - Sentry source maps for that same SHA (parallel job; skipped if token unset)
#
# Tags: ghcr.io/<owner>/{web,api,worker,docs}:<git-sha>
#
# Each platform builds natively (amd64 / ubuntu-24.04-arm) — no QEMU.
# Emulated arm64 previously hung worker on `pnpm install` with:
#   qemu: uncaught target signal 4 (Illegal instruction)
# SBOM + provenance attestations are enabled here (local `make images` keeps
# them off so size budgets stay meaningful).
#
# Deploy is bring-your-own host: pull these SHA tags, run migrate via the api
# image (`node dist/migrate.mjs`), then roll apps. See docs/runbooks/deploy.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # Same SHA as the GHCR tags — not a CI gate, and never on PRs.
  sentry-sourcemaps:
    name: Sentry source maps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo_team: ${{ vars.TURBO_TEAM }}
      - name: Build api, worker, and web (source maps)
        env:
          # Match docker/web.Dockerfile — layout flag bootstrap imports server env.
          SKIP_ENV_VALIDATION: "1"
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_ENV: production
        run: |
          pnpm --filter @repo/api --filter @repo/worker build
          pnpm --filter @repo/web build
      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT_API: ${{ vars.SENTRY_PROJECT_API }}
          SENTRY_PROJECT_WORKER: ${{ vars.SENTRY_PROJECT_WORKER }}
          SENTRY_PROJECT_WEB: ${{ vars.SENTRY_PROJECT_WEB }}
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN unset — skipping source map upload."
            exit 0
          fi
          if [ -z "${SENTRY_ORG:-}" ]; then
            echo "SENTRY_ORG unset — skipping source map upload."
            exit 0
          fi
          release="${GITHUB_SHA}"
          curl -sSL https://github.com/getsentry/sentry-cli/releases/download/2.42.2/sentry-cli-Linux-x86_64 \
            -o /usr/local/bin/sentry-cli
          chmod +x /usr/local/bin/sentry-cli
          upload() {
            local project="$1"
            local dist_dir="$2"
            if [ -z "${project:-}" ]; then
              echo "Project unset — skipping ${dist_dir}."
              return 0
            fi
            sentry-cli sourcemaps upload \
              --org "$SENTRY_ORG" \
              --project "$project" \
              --release "$release" \
              "$dist_dir"
          }
          upload "$SENTRY_PROJECT_API" apps/api/dist
          upload "$SENTRY_PROJECT_WORKER" apps/worker/dist
          upload "$SENTRY_PROJECT_WEB" apps/web/.next/static

  build:
    name: Build ${{ matrix.app.name }} (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        app:
          - name: web
            file: docker/web.Dockerfile
          - name: api
            file: docker/api.Dockerfile
          - name: worker
            file: docker/worker.Dockerfile
          - name: docs
            file: docker/docs.Dockerfile
        platform:
          - name: amd64
            target: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            target: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name (lowercase)
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${{ env.REGISTRY }}/${owner}/${{ matrix.app.name }}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scan the runnable amd64 image before pushing digests for that platform.
      - name: Build amd64 for Trivy
        if: matrix.platform.name == 'amd64'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.app.file }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.image }}:trivy
          provenance: false
          sbom: false
          cache-from: type=gha,scope=publish-${{ matrix.app.name }}-amd64
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.app.name }}-amd64

      - name: Trivy scan
        if: matrix.platform.name == 'amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:trivy
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.app.file }}
          platforms: ${{ matrix.platform.target }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=publish-${{ matrix.app.name }}-${{ matrix.platform.name }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.app.name }}-${{ matrix.platform.name }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.app.name }}-${{ matrix.platform.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge ${{ matrix.app }}
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        app: [web, api, worker, docs]

    steps:
      - name: Image name (lowercase)
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${{ env.REGISTRY }}/${owner}/${{ matrix.app }}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}" \
            $(printf '${{ steps.meta.outputs.image }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}"
