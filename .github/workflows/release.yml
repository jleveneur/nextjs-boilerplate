name: Release

# Turns merged changesets into a version bump and a changelog.
#
# The flow is two-step on purpose. This workflow does not release anything when it
# runs: it opens (or updates) a "Version packages" pull request containing the
# bumps and generated changelogs. Releasing happens when a human merges that PR.
# A version number is a claim about what changed, and it should be reviewed like
# any other claim.
#
# See docs/architecture/12-git-ci-release.md#5-versioning-and-releases--changesets.

on:
  push:
    branches: [main]
  # Allows recovery when a run failed for an unrelated reason, without needing an
  # empty commit to re-trigger it.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version packages
    runs-on: ubuntu-latest

    permissions:
      # Writing is done with the app installation token, not GITHUB_TOKEN, so the
      # default token only needs to read this repository.
      contents: read
      # Optional Vercel Turborepo remote cache OIDC.
      id-token: write

    steps:
      # The version PR must be authored by something other than the default
      # GITHUB_TOKEN. A PR opened by `github-actions[bot]` counts as a first-time
      # contributor under the repository's fork-PR approval policy, so its checks
      # sit at `action_required` until a maintainer clicks Approve — and `CI` is a
      # required check, so the PR can never merge on its own. An installation
      # token is short-lived and scoped to this repository, unlike a PAT.
      - name: Mint an app installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Latest main, not the SHA that triggered this run. Runs serialize on
          # the concurrency group above, so a queued run can reach the changesets
          # step after a version PR has already merged. Pinned to its trigger it
          # would version a main where the changeset still exists and open a
          # duplicate version PR; from main's tip it correctly finds none.
          ref: main
          # Changesets compares against the base branch to work out which
          # packages changed, which needs more than a shallow clone.
          fetch-depth: 0
          # Persist the app token so the version branch is pushed as the app.
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup
        with:
          turbo_team: ${{ vars.TURBO_TEAM }}

      # Nothing is published to a registry — every package is private — so there
      # is no `publish` input and no npm token. The action's job here is the
      # version PR and the changelogs.
      - name: Create or update the version pull request
        uses: changesets/action@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0
        with:
          version: pnpm exec changeset version
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
          # Packages are private — changelogs only, no GitHub Releases.
          createGithubReleases: false
          # The lockfile records the bumped internal versions, so it has to be
          # refreshed in the same commit or the version PR fails its own CI.
          setupGitUser: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
