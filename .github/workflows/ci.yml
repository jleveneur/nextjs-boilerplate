name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push makes the previous run's answer irrelevant. `main` is exempt so the
# post-merge record stays complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile makes an out-of-date lockfile a CI failure rather than
      # something CI silently fixes.
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm react-doctor
      - run: pnpm test

      # The PR title becomes the squashed commit message, so it is the thing
      # that has to satisfy commitlint. The commit-msg hook covers local commits.
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.title }}" | pnpm exec commitlint

      # `next build` evaluates route modules, which validate the environment.
      # No secret is baked into the output — nothing is NEXT_PUBLIC_ — so
      # placeholders are enough to prove the app compiles.
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app
          BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000
