name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push makes the previous run's answer irrelevant. `main` is exempt so the
# post-merge record stays complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs pnpm (from `packageManager`), Node (from `devEngines.runtime`),
      # and the dependencies in one step. `require-lockfile` is stricter than
      # `--frozen-lockfile` alone: it also fails when no lockfile exists, which
      # a plain install would quietly resolve from the registry and accept.
      - uses: pnpm/setup@v2
        with:
          cache: true
          require-lockfile: true

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm react-doctor
      - run: pnpm test

      # The PR title becomes the squashed commit message, so it is the thing
      # that has to satisfy commitlint. The commit-msg hook covers local commits.
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.title }}" | pnpm exec commitlint

      # `next build` evaluates route modules, which validate the environment.
      # No secret is baked into the output — nothing is NEXT_PUBLIC_ — so
      # placeholders are enough to prove the app compiles.
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app
          BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000

  integration:
    name: Integration
    runs-on: ubuntu-latest

    # The one suite that needs a real database: Better Auth writing through the
    # Drizzle adapter, and permissions read back from the rows it wrote.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app
      BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/setup@v2
        with:
          cache: true
          require-lockfile: true

      - run: pnpm db:migrate
      - run: pnpm test:integration
