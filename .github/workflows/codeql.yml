name: CodeQL

# Static analysis for the JavaScript/TypeScript graph. Kept as its own workflow
# so branch protection can require it without folding its duration into the
# aggregate CI job wall-clock. See docs/architecture/12-git-ci-release.md §3.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly catch-up for the query pack; PRs still get an on-demand run.
    - cron: "17 4 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
        with:
          category: "/language:javascript-typescript"
